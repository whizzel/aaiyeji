<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 24" width="240" height="24" role="img" aria-label="Floral divider">
  <!-- Floral divider — a central lotus bud with curling stems. Original line art.
       Stroke uses currentColor in app usage; master keeps antique gold. -->
  <g fill="none" stroke="#C99B50" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- left stem -->
    <path d="M8 12 H92"/>
    <path d="M92 12 C98 12 102 9 104 5"/>
    <path d="M70 12 C74 8 80 8 84 12 C80 16 74 16 70 12 Z"/>
    <circle cx="14" cy="12" r="1.8" fill="#C99B50" stroke="none"/>
    <!-- right stem -->
    <path d="M232 12 H148"/>
    <path d="M148 12 C142 12 138 9 136 5"/>
    <path d="M170 12 C166 8 160 8 156 12 C160 16 166 16 170 12 Z"/>
    <circle cx="226" cy="12" r="1.8" fill="#C99B50" stroke="none"/>
    <!-- central bud -->
    <path d="M120 19 C116.4 14.4 116.4 8.6 120 3.5 C123.6 8.6 123.6 14.4 120 19 Z"/>
    <path d="M120 19 C114.4 18.2 110.6 14.4 109.6 9.2 C115.2 10 119 13.8 120 19 Z"/>
    <path d="M120 19 C125.6 18.2 129.4 14.4 130.4 9.2 C124.8 10 121 13.8 120 19 Z"/>
    <path d="M113 21.5 H127" stroke-width="1.1"/>
