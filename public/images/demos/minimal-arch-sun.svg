    <path d="M110 420 V250 C110 180 150 130 200 116 C250 130 290 180 290 250 V420" stroke="#70233F" stroke-width="2.2"/>
    <path d="M126 420 V252 C126 190 160 146 200 133 C240 146 274 190 274 252 V420" stroke="#70233F" stroke-width="1" opacity="0.45"/>
