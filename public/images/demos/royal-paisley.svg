    <circle cx="186" cy="318" r="4" stroke-width="1.3"/>
    <path d="M156 250 C150 240 152 230 160 224 C168 230 170 240 164 250" stroke-width="1.2"/>
    <circle cx="216" cy="200" r="3.4" stroke-width="1.2"/>
    <circle cx="248" cy="168" r="3" stroke-width="1.2"/>
    <!-- dots along the curve -->
    <g fill="#E4C98F" stroke="none">
      <circle cx="140" cy="330" r="2.4"/><circle cx="152" cy="356" r="2.4"/><circle cx="172" cy="376" r="2.4"/>
      <circle cx="120" cy="300" r="2.4"/><circle cx="122" cy="268" r="2.4"/><circle cx="132" cy="236" r="2.4"/>
    </g>
    <!-- corner sprigs -->
    <path d="M52 452 C64 444 76 444 88 452" stroke-width="1.2"/>
    <path d="M312 452 C324 444 336 444 348 452" stroke-width="1.2"/>
    <path d="M52 60 C64 52 76 52 88 60" stroke-width="1.2"/>
  </g>
</svg>
