<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Gold paisley line art">
  <!-- Original Aaiyeji artwork — royal demo gallery. -->
  <rect width="400" height="500" fill="#241019"/>
  <rect x="16" y="16" width="368" height="468" fill="none" stroke="#C99B50" stroke-width="1" opacity="0.5"/>
  <g fill="none" stroke="#C99B50" stroke-linecap="round" stroke-linejoin="round">
    <!-- large paisley -->
    <path d="M200 420 C130 400 96 340 104 272 C112 204 160 150 216 128 C262 110 292 84 296 52 C316 84 314 122 288 150 C262 178 224 190 204 224 C184 258 190 300 216 322 C242 344 276 340 292 316 C308 292 300 262 278 252 C256 242 234 254 232 276" stroke-width="2.2"/>
