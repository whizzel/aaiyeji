<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Two overlapping thin-line rings">
  <!-- Original Aaiyeji artwork — minimal demo gallery. -->
  <rect width="400" height="500" fill="#FAF8F4"/>
  <rect x="16" y="16" width="368" height="468" fill="none" stroke="#E4DDD2" stroke-width="1.5"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="168" cy="250" r="86" stroke="#70233F" stroke-width="2.4"/>
    <circle cx="238" cy="250" r="86" stroke="#C99B50" stroke-width="2.4"/>
    <!-- small diamond on the gold ring -->
    <path d="M238 152 L246 164 L238 176 L230 164 Z" stroke="#C99B50" stroke-width="1.6"/>
    <!-- hairline baseline -->
    <path d="M110 392 H290" stroke="#221D1F" stroke-width="1" opacity="0.35"/>
    <circle cx="203" cy="392" r="2.6" fill="#70233F" stroke="none"/>
  </g>
  <text x="200" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="6" fill="#221D1F" opacity="0.6">S · K</text>
</svg>
