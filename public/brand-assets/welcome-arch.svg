<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Decorative welcome arch line art">
  <!-- Welcome arch — decorative pattern. Stroke uses currentColor so the app can tint it.
       Master copy keeps antique gold. Inspired by Indian doorway/ogee arches; original drawing. -->
  <g fill="none" stroke="#C99B50" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer ogee arch -->
    <path d="M40 500 V250 C40 190 70 150 120 120 C165 93 185 70 200 34 C215 70 235 93 280 120 C330 150 360 190 360 250 V500" stroke-width="2"/>
    <!-- inner arch -->
    <path d="M62 500 V255 C62 205 88 170 132 143 C172 119 190 98 200 70 C210 98 228 119 268 143 C312 170 338 205 338 255 V500" stroke-width="1.2"/>
    <!-- finial -->
    <path d="M200 34 V14" stroke-width="1.6"/>
    <circle cx="200" cy="10" r="3.4" stroke-width="1.4"/>
    <!-- pillar capitals -->
    <path d="M30 250 H72 M328 250 H370" stroke-width="1.4"/>
    <path d="M34 262 H68 M332 262 H366" stroke-width="1"/>
    <!-- threshold steps -->
    <path d="M20 500 H380" stroke-width="2"/>
    <path d="M34 510 H366" stroke-width="1.2"/>
    <!-- hanging marigold strands -->
    <path d="M96 176 V236" stroke-width="1"/>
    <circle cx="96" cy="242" r="4" stroke-width="1.2"/>
    <circle cx="96" cy="254" r="3" stroke-width="1"/>
    <path d="M304 176 V236" stroke-width="1"/>
    <circle cx="304" cy="242" r="4" stroke-width="1.2"/>
    <circle cx="304" cy="254" r="3" stroke-width="1"/>
    <!-- lotus at the heart of the doorway -->
    <path d="M200 430 C192 419 192 405 200 392 C208 405 208 419 200 430 Z" stroke-width="1.6"/>
    <path d="M200 430 C186 428 176 419 174 405 C188 407 197 416 200 430 Z" stroke-width="1.3"/>
    <path d="M200 430 C214 428 224 419 226 405 C212 407 203 416 200 430 Z" stroke-width="1.3"/>
    <path d="M186 438 H214" stroke-width="1.2"/>
    <!-- corner petals -->
    <path d="M40 500 C52 492 60 492 72 500" stroke-width="1"/>
    <path d="M328 500 C340 492 348 492 360 500" stroke-width="1"/>
  </g>
</svg>
